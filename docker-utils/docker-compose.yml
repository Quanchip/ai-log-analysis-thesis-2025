
services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - thesis-network
  
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - thesis-network
      
  postgres:
    image: postgres:15
    container_name: postgres_db
    environment:
      POSTGRES_DB: myproject
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 20s
      timeout: 10s
      retries: 3
    networks:
      - thesis-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_container
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8088:80"
    depends_on:
      - postgres
    networks:
      - thesis-network

  backend:
    build: ../backend
    container_name: backend-thesis
    # command: uvicorn src.main:app --reload --host 0.0.0.0 --port 8000
    volumes:
      - ../backend:/app
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=myproject
      - DB_USER=postgres
      - DB_PASSWORD=password
      - SECRET_KEY=025ee95f1b360868c969aa2e8fcb280e
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: 
      - thesis-network

  celery-worker:
    container_name: celery-worker
    build: ../backend
    command: celery -A src.celery.celery worker --loglevel=info
    volumes:
      - ../backend:/app
    environment:
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      # - DATABASE_URL=${DATABASE_URL}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=myproject
      - DB_USER=postgres
      - DB_PASSWORD=password
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=admin123
      - MINIO_BUCKET_NAME=raw-logs
      - MINIO_SECURE=false
    depends_on:
      - redis
      - minio
      - postgres
    networks:
      - thesis-network
    restart: unless-stopped

  flower:
    build: ../backend
    container_name: flower
    command: celery -A src.celery.celery flower --port=5555
    ports:
      - "5555:5555"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
    depends_on:
      - backend
      - redis
      - celery-worker
    networks:
      - thesis-network

  frontend:
    build: ../frontend
    container_name: myfrontend
    # command: npm run dev -- --host 0.0.0.0
    volumes:
      - ../frontend:/app  # <--- mount code để hot reload frontend
      - /app/node_modules  # tránh xung đột node_modules host
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - thesis-network


volumes:
  minio_data:
  postgres_data:
  redis_data:

networks:
  thesis-network:
    driver: bridge

